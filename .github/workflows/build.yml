name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  VULKAN_SDK_VERSION: 1.3.296.0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = "${{ env.VULKAN_SDK_VERSION }}"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--root C:\VulkanSDK\$v --accept-licenses --default-answer --confirm-command install"

      - name: Set VULKAN_SDK
        shell: pwsh
        run: echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { throw "glslc.exe not found in $env:VULKAN_SDK" }

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test (C# scripting)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\IndeetsEngine"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\bin\Release\IndeetsEngine-Editor.exe $out\
          Copy-Item build\bin\Release\Sandbox.exe $out\IndeetsEngine-Sandbox.exe
          Copy-Item -Recurse build\bin\Release\shaders $out\shaders
          Copy-Item -Recurse build\bin\Release\Managed $out\Managed
          # .NET 8 runtime next to the exe, so C# scripts work without installing anything.
          $dotnet = Split-Path (Get-Command dotnet).Source
          $fxr = Get-ChildItem "$dotnet\host\fxr" | Sort-Object { [version]($_.Name -replace '-.*', '') } | Select-Object -Last 1
          $runtime = Get-ChildItem "$dotnet\shared\Microsoft.NETCore.App" | Where-Object { $_.Name -like '8.*' } |
                     Sort-Object { [version]($_.Name -replace '-.*', '') } | Select-Object -Last 1
          New-Item -ItemType Directory -Force "$out\dotnet\host\fxr", "$out\dotnet\shared\Microsoft.NETCore.App" | Out-Null
          Copy-Item -Recurse $fxr.FullName "$out\dotnet\host\fxr\"
          Copy-Item -Recurse $runtime.FullName "$out\dotnet\shared\Microsoft.NETCore.App\"
          Copy-Item "$dotnet\LICENSE.txt", "$dotnet\ThirdPartyNotices.txt" "$out\dotnet\" -ErrorAction SilentlyContinue
          Copy-Item README.md $out\
          Compress-Archive -Path "$out\*" -DestinationPath IndeetsEngine-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: IndeetsEngine-Windows-x64
          path: dist/IndeetsEngine

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: IndeetsEngine-Windows-x64.zip
          name: IndeetsEngine ${{ inputs.release_tag || github.ref_name }}
          body: |
            Готовая сборка для Windows 10/11 x64.

            1. Скачайте **IndeetsEngine-Windows-x64.zip** ниже и распакуйте в любую папку.
            2. Запустите **IndeetsEngine-Editor.exe** — редактор (сцены сохраняются в папку `Project` рядом с exe).
               **IndeetsEngine-Sandbox.exe** — демо без редактора (Space — бросить шар, R — перезапуск).

            Нужна видеокарта с поддержкой Vulkan 1.3 и свежий драйвер.
            C#-скрипты работают сразу: среда .NET 8 лежит в папке `dotnet` рядом с exe.
            Окно Scene: ПКМ + WASD/QE — полёт, СКМ — панорама, колесо — зум, F — к объекту,
            W/E/R — перемещение/поворот/масштаб, Ctrl+P — Play/Stop, Ctrl+S — сохранить.

  linux-tests:
    name: Linux (engine + C# scripting tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libgl-dev

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release --parallel

      - name: Test (C# scripting)
        run: ctest --test-dir build/ninja-release --output-on-failure
