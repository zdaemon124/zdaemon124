name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  VULKAN_SDK_VERSION: 1.3.296.0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = "${{ env.VULKAN_SDK_VERSION }}"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--root C:\VulkanSDK\$v --accept-licenses --default-answer --confirm-command install"

      - name: Set VULKAN_SDK
        shell: pwsh
        run: echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { throw "glslc.exe not found in $env:VULKAN_SDK" }

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\ZEngine"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\bin\Release\Sandbox.exe $out\ZEngine-Sandbox.exe
          Copy-Item -Recurse build\bin\Release\shaders $out\shaders
          Copy-Item README.md $out\
          Compress-Archive -Path "$out\*" -DestinationPath ZEngine-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ZEngine-Windows-x64
          path: dist/ZEngine

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ZEngine-Windows-x64.zip
          name: ZEngine ${{ inputs.release_tag || github.ref_name }}
          body: |
            Готовая сборка для Windows 10/11 x64.

            1. Скачайте **ZEngine-Windows-x64.zip** ниже и распакуйте в любую папку.
            2. Запустите **ZEngine-Sandbox.exe**.

            Нужна видеокарта с поддержкой Vulkan 1.3 и свежий драйвер.
            Управление: ПКМ + WASD/QE — полёт, колесо — зум, Space — пауза, Esc — выход.
